<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>

  <!-- Grid dots -->
  <g opacity="0.04" fill="#8B5CF6">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="480" cy="80" r="1.5"/><circle cx="560" cy="80" r="1.5"/><circle cx="640" cy="80" r="1.5"/><circle cx="720" cy="80" r="1.5"/>
  </g>

  <!-- Double diamond shape -->
  <g transform="translate(400, 170)">
    <!-- Left diamond (Discover + Define) -->
    <path d="M-180 0 L-90 -70 L0 0 L-90 70 Z" fill="#2E1065" opacity="0.1" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.2"/>
    <!-- Right diamond (Develop + Deliver) -->
    <path d="M0 0 L90 -70 L180 0 L90 70 Z" fill="#083344" opacity="0.1" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.2"/>

    <!-- Center divider line -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#4B5563" stroke-width="0.5" opacity="0.15"/>

    <!-- Phase labels -->
    <text x="-135" y="-4" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Discover</text>
    <text x="-45" y="-4" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Define</text>
    <text x="45" y="-4" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Develop</text>
    <text x="135" y="-4" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Deliver</text>

    <!-- Phase nodes -->
    <circle cx="-180" cy="0" r="6" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="-90" cy="-70" r="6" fill="#8B5CF6" opacity="0.5"/>
    <circle cx="0" cy="0" r="8" fill="#4B5563" opacity="0.5" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="90" cy="-70" r="6" fill="#06B6D4" opacity="0.5"/>
    <circle cx="180" cy="0" r="6" fill="#06B6D4" opacity="0.4"/>
  </g>

  <!-- Process steps below -->
  <g transform="translate(150, 290)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="110" height="40" rx="8" fill="#1F2937" opacity="0.6" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="15" y="17" fill="#C4B5FD" font-family="monospace" font-size="10" font-weight="bold">01</text>
    <text x="15" y="31" fill="#9CA3AF" font-family="system-ui" font-size="9">Research</text>
    <!-- Arrow -->
    <path d="M115 20 L135 20" stroke="#4B5563" stroke-width="1" opacity="0.2"/>

    <!-- Step 2 -->
    <rect x="140" y="0" width="110" height="40" rx="8" fill="#1F2937" opacity="0.6" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="155" y="17" fill="#67E8F9" font-family="monospace" font-size="10" font-weight="bold">02</text>
    <text x="155" y="31" fill="#9CA3AF" font-family="system-ui" font-size="9">Ideate</text>
    <!-- Arrow -->
    <path d="M255 20 L275 20" stroke="#4B5563" stroke-width="1" opacity="0.2"/>

    <!-- Step 3 -->
    <rect x="280" y="0" width="110" height="40" rx="8" fill="#1F2937" opacity="0.6" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="295" y="17" fill="#6EE7B7" font-family="monospace" font-size="10" font-weight="bold">03</text>
    <text x="295" y="31" fill="#9CA3AF" font-family="system-ui" font-size="9">Prototype</text>
    <!-- Arrow -->
    <path d="M395 20 L415 20" stroke="#4B5563" stroke-width="1" opacity="0.2"/>

    <!-- Step 4 -->
    <rect x="420" y="0" width="110" height="40" rx="8" fill="#1F2937" opacity="0.6" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="435" y="17" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold">04</text>
    <text x="435" y="31" fill="#9CA3AF" font-family="system-ui" font-size="9">Validate</text>
  </g>

  <!-- Divider -->
  <line x1="250" y1="380" x2="550" y2="380" stroke="#8B5CF6" stroke-width="1" opacity="0.1"/>

  <!-- Title -->
  <text x="400" y="430" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="32" font-weight="bold">My Design Process</text>
  <text x="400" y="465" text-anchor="middle" fill="#9CA3AF" font-family="system-ui" font-size="14">A repeatable approach for complex products</text>

  <!-- Bottom tags -->
  <text x="200" y="530" text-anchor="middle" fill="#8B5CF6" font-family="monospace" font-size="11">Strategy</text>
  <text x="320" y="530" text-anchor="middle" fill="#4B5563" font-family="monospace" font-size="11">·</text>
  <text x="400" y="530" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="11">Research</text>
  <text x="480" y="530" text-anchor="middle" fill="#4B5563" font-family="monospace" font-size="11">·</text>
  <text x="560" y="530" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="11">Design</text>
</svg>
