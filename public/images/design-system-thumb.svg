<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>

  <!-- Grid dots -->
  <g opacity="0.04" fill="#6366F1">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="480" cy="80" r="1.5"/><circle cx="560" cy="80" r="1.5"/><circle cx="640" cy="80" r="1.5"/><circle cx="720" cy="80" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="480" cy="160" r="1.5"/><circle cx="560" cy="160" r="1.5"/><circle cx="640" cy="160" r="1.5"/><circle cx="720" cy="160" r="1.5"/>
  </g>

  <!-- Component grid - simulating a design system library -->
  <!-- Row 1: Buttons -->
  <rect x="120" y="80" width="160" height="50" rx="8" fill="#1F2937" opacity="0.5" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="136" y="96" width="70" height="22" rx="6" fill="#6366F1" opacity="0.2" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="171" y="111" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="8">Button</text>
  <rect x="216" y="96" width="50" height="22" rx="6" fill="none" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="241" y="111" text-anchor="middle" fill="#6366F1" font-family="monospace" font-size="8">Ghost</text>

  <!-- Row 1: Input -->
  <rect x="310" y="80" width="170" height="50" rx="8" fill="#1F2937" opacity="0.5" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="326" y="96" width="140" height="22" rx="4" fill="#083344" opacity="0.3" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="346" y="111" fill="#67E8F9" font-family="monospace" font-size="8">Input field...</text>

  <!-- Row 1: Toggle -->
  <rect x="510" y="80" width="150" height="50" rx="8" fill="#1F2937" opacity="0.5" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="530" y="95" width="36" height="20" rx="10" fill="#064E3B" opacity="0.5" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="554" cy="105" r="7" fill="#10B981" opacity="0.5"/>
  <text x="580" y="109" fill="#6EE7B7" font-family="monospace" font-size="8">Toggle</text>

  <!-- Row 2: Card -->
  <rect x="120" y="150" width="200" height="90" rx="8" fill="#1F2937" opacity="0.5" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Card header bar -->
  <rect x="120" y="150" width="200" height="28" rx="8" fill="#8B5CF6" opacity="0.06"/>
  <rect x="136" y="159" width="60" height="8" rx="4" fill="#8B5CF6" opacity="0.2"/>
  <!-- Card content lines -->
  <rect x="136" y="192" width="140" height="5" rx="2.5" fill="#8B5CF6" opacity="0.08"/>
  <rect x="136" y="204" width="100" height="5" rx="2.5" fill="#8B5CF6" opacity="0.06"/>
  <rect x="136" y="216" width="120" height="5" rx="2.5" fill="#8B5CF6" opacity="0.05"/>

  <!-- Row 2: Color tokens -->
  <rect x="350" y="150" width="130" height="90" rx="8" fill="#1F2937" opacity="0.5" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3"/>
  <text x="366" y="170" fill="#FCD34D" font-family="monospace" font-size="8">Tokens</text>
  <circle cx="376" cy="195" r="10" fill="#6366F1" opacity="0.4"/>
  <circle cx="404" cy="195" r="10" fill="#06B6D4" opacity="0.4"/>
  <circle cx="432" cy="195" r="10" fill="#10B981" opacity="0.4"/>
  <circle cx="460" cy="195" r="10" fill="#F59E0B" opacity="0.4"/>
  <rect x="366" y="218" width="90" height="4" rx="2" fill="#FCD34D" opacity="0.08"/>

  <!-- Row 2: Typography -->
  <rect x="510" y="150" width="150" height="90" rx="8" fill="#1F2937" opacity="0.5" stroke="#EC4899" stroke-width="1" stroke-opacity="0.3"/>
  <text x="530" y="177" fill="#F9A8D4" font-family="system-ui" font-size="18" font-weight="bold" opacity="0.5">Aa</text>
  <rect x="530" y="195" width="80" height="4" rx="2" fill="#EC4899" opacity="0.12"/>
  <rect x="530" y="206" width="60" height="3" rx="1.5" fill="#EC4899" opacity="0.08"/>
  <rect x="530" y="216" width="100" height="3" rx="1.5" fill="#EC4899" opacity="0.06"/>

  <!-- Divider -->
  <line x1="250" y1="300" x2="550" y2="300" stroke="#6366F1" stroke-width="1" opacity="0.1"/>

  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="32" font-weight="bold">Design System</text>
  <text x="400" y="385" text-anchor="middle" fill="#9CA3AF" font-family="system-ui" font-size="14">End-to-end component library &amp; tokens</text>

  <!-- Layer pills -->
  <rect x="140" y="420" width="100" height="28" rx="14" fill="#1F2937" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="190" y="439" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="10">Tokens</text>

  <rect x="260" y="420" width="120" height="28" rx="14" fill="#1F2937" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="320" y="439" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10">Components</text>

  <rect x="400" y="420" width="100" height="28" rx="14" fill="#1F2937" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="450" y="439" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">Patterns</text>

  <rect x="520" y="420" width="120" height="28" rx="14" fill="#1F2937" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="580" y="439" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="10">Guidelines</text>

  <!-- Metrics -->
  <text x="200" y="510" text-anchor="middle" fill="#6366F1" font-family="monospace" font-size="24" font-weight="bold">50+</text>
  <text x="200" y="535" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Components</text>

  <text x="400" y="510" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="24" font-weight="bold">1000+</text>
  <text x="400" y="535" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Design Tokens</text>

  <text x="600" y="510" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="24" font-weight="bold">100%</text>
  <text x="600" y="535" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Figma + Code</text>
</svg>
