<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-ds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="shape-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="shape-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-ds)"/>

  <!-- Grid dots pattern -->
  <g opacity="0.06" fill="#818cf8">
    <circle cx="80" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="240" cy="80" r="2"/><circle cx="320" cy="80" r="2"/><circle cx="400" cy="80" r="2"/><circle cx="480" cy="80" r="2"/><circle cx="560" cy="80" r="2"/><circle cx="640" cy="80" r="2"/><circle cx="720" cy="80" r="2"/>
    <circle cx="80" cy="160" r="2"/><circle cx="160" cy="160" r="2"/><circle cx="240" cy="160" r="2"/><circle cx="320" cy="160" r="2"/><circle cx="400" cy="160" r="2"/><circle cx="480" cy="160" r="2"/><circle cx="560" cy="160" r="2"/><circle cx="640" cy="160" r="2"/><circle cx="720" cy="160" r="2"/>
    <circle cx="80" cy="240" r="2"/><circle cx="160" cy="240" r="2"/><circle cx="240" cy="240" r="2"/><circle cx="320" cy="240" r="2"/><circle cx="400" cy="240" r="2"/><circle cx="480" cy="240" r="2"/><circle cx="560" cy="240" r="2"/><circle cx="640" cy="240" r="2"/><circle cx="720" cy="240" r="2"/>
    <circle cx="80" cy="320" r="2"/><circle cx="160" cy="320" r="2"/><circle cx="240" cy="320" r="2"/><circle cx="320" cy="320" r="2"/><circle cx="400" cy="320" r="2"/><circle cx="480" cy="320" r="2"/><circle cx="560" cy="320" r="2"/><circle cx="640" cy="320" r="2"/><circle cx="720" cy="320" r="2"/>
  </g>

  <!-- Geometric shapes - design system components -->
  <!-- Large square -->
  <rect x="240" y="100" width="100" height="100" rx="12" fill="none" stroke="url(#shape-grad)" stroke-width="2" opacity="0.3" transform="rotate(-8, 290, 150)"/>

  <!-- Circle -->
  <circle cx="460" cy="140" r="50" fill="none" stroke="url(#shape-grad2)" stroke-width="2" opacity="0.25"/>
  <circle cx="460" cy="140" r="30" fill="#6366f1" opacity="0.08"/>

  <!-- Small squares (component blocks) -->
  <rect x="560" y="110" width="60" height="60" rx="8" fill="#6366f1" opacity="0.1" transform="rotate(12, 590, 140)"/>
  <rect x="580" y="130" width="60" height="60" rx="8" fill="#818cf8" opacity="0.08" transform="rotate(12, 610, 160)"/>

  <!-- Triangle -->
  <polygon points="350,180 390,240 310,240" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.2"/>

  <!-- Connection lines between shapes -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.08" stroke-dasharray="6,6">
    <line x1="340" y1="150" x2="410" y2="140"/>
    <line x1="510" y1="140" x2="560" y2="140"/>
    <line x1="350" y1="210" x2="400" y2="250"/>
  </g>

  <!-- Horizontal layers (architecture concept) -->
  <g opacity="0.08">
    <rect x="200" y="270" width="400" height="30" rx="6" fill="#6366f1"/>
    <rect x="220" y="310" width="360" height="30" rx="6" fill="#818cf8"/>
    <rect x="240" y="350" width="320" height="30" rx="6" fill="#a5b4fc"/>
  </g>

  <!-- Accent divider -->
  <rect x="250" y="430" width="300" height="2" fill="url(#bar-grad)" rx="1"/>

  <!-- Text -->
  <text x="400" y="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Design System</text>
  <text x="400" y="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Architect</text>
  <text x="400" y="558" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#818cf8" text-anchor="middle" letter-spacing="4">TOKENS &#183; COMPONENTS &#183; PATTERNS</text>
</svg>