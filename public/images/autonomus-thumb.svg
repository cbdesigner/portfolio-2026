<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>

  <!-- Grid dots -->
  <g opacity="0.04" fill="#10B981">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="480" cy="80" r="1.5"/><circle cx="560" cy="80" r="1.5"/><circle cx="640" cy="80" r="1.5"/><circle cx="720" cy="80" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="480" cy="160" r="1.5"/><circle cx="560" cy="160" r="1.5"/><circle cx="640" cy="160" r="1.5"/><circle cx="720" cy="160" r="1.5"/>
  </g>

  <!-- Map background shape -->
  <rect x="200" y="70" width="400" height="220" rx="12" fill="#064E3B" opacity="0.08" stroke="#10B981" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Route path -->
  <path d="M280 200 C320 200, 340 140, 400 140 C460 140, 480 200, 520 200" stroke="#10B981" stroke-width="2" opacity="0.2" fill="none" stroke-dasharray="6,4"/>

  <!-- Pin A -->
  <circle cx="280" cy="200" r="12" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="280" cy="200" r="4" fill="#10B981" opacity="0.6"/>
  <text x="280" y="180" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10" opacity="0.6">A</text>

  <!-- Pin B -->
  <circle cx="520" cy="200" r="12" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="520" cy="200" r="4" fill="#F59E0B" opacity="0.6"/>
  <text x="520" y="180" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="10" opacity="0.6">B</text>

  <!-- User avatars (abstract circles) -->
  <circle cx="350" cy="110" r="18" fill="#1F2937" stroke="#10B981" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="350" cy="105" r="6" fill="#10B981" opacity="0.2"/>
  <path d="M340 118 Q350 125 360 118" stroke="#10B981" stroke-width="1" opacity="0.2" fill="none"/>

  <circle cx="450" cy="110" r="18" fill="#1F2937" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="450" cy="105" r="6" fill="#F59E0B" opacity="0.2"/>
  <path d="M440 118 Q450 125 460 118" stroke="#F59E0B" stroke-width="1" opacity="0.2" fill="none"/>

  <!-- Connection line -->
  <line x1="368" y1="110" x2="432" y2="110" stroke="#4B5563" stroke-width="1" opacity="0.12" stroke-dasharray="3,3"/>

  <!-- Car icon (simplified) -->
  <rect x="385" y="150" width="30" height="16" rx="4" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="392" cy="168" r="4" fill="none" stroke="#10B981" stroke-width="1" opacity="0.2"/>
  <circle cx="408" cy="168" r="4" fill="none" stroke="#10B981" stroke-width="1" opacity="0.2"/>

  <!-- Divider -->
  <line x1="250" y1="330" x2="550" y2="330" stroke="#10B981" stroke-width="1" opacity="0.1"/>

  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="32" font-weight="bold">Autonomus</text>
  <text x="400" y="415" text-anchor="middle" fill="#9CA3AF" font-family="system-ui" font-size="14">Senior mobility &amp; companionship platform</text>

  <!-- Metrics -->
  <text x="200" y="495" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="24" font-weight="bold">60+</text>
  <text x="200" y="520" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Screens</text>

  <text x="400" y="495" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="24" font-weight="bold">3</text>
  <text x="400" y="520" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">User Flows</text>

  <text x="600" y="495" text-anchor="middle" fill="#8B5CF6" font-family="monospace" font-size="24" font-weight="bold">A11y</text>
  <text x="600" y="520" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Accessible</text>
</svg>
