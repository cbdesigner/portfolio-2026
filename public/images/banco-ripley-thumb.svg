<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>

  <!-- Grid dots -->
  <g opacity="0.05" fill="#3B82F6">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="480" cy="80" r="1.5"/><circle cx="560" cy="80" r="1.5"/><circle cx="640" cy="80" r="1.5"/><circle cx="720" cy="80" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="480" cy="160" r="1.5"/><circle cx="560" cy="160" r="1.5"/><circle cx="640" cy="160" r="1.5"/><circle cx="720" cy="160" r="1.5"/>
    <circle cx="80" cy="240" r="1.5"/><circle cx="160" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="320" cy="240" r="1.5"/><circle cx="400" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/><circle cx="560" cy="240" r="1.5"/><circle cx="640" cy="240" r="1.5"/><circle cx="720" cy="240" r="1.5"/>
  </g>

  <!-- Mobile screen outline -->
  <rect x="280" y="60" width="120" height="210" rx="16" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.25"/>
  <rect x="290" y="80" width="100" height="160" rx="4" fill="#3B82F6" opacity="0.04"/>
  <!-- Screen content lines -->
  <rect x="300" y="95" width="60" height="6" rx="3" fill="#3B82F6" opacity="0.15"/>
  <rect x="300" y="112" width="80" height="4" rx="2" fill="#60A5FA" opacity="0.08"/>
  <rect x="300" y="124" width="70" height="4" rx="2" fill="#60A5FA" opacity="0.08"/>
  <!-- Card element inside -->
  <rect x="300" y="145" width="80" height="50" rx="6" fill="#1E3A5F" opacity="0.4" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="308" y="155" width="30" height="4" rx="2" fill="#60A5FA" opacity="0.3"/>
  <rect x="308" y="165" width="50" height="3" rx="1.5" fill="#60A5FA" opacity="0.15"/>
  <rect x="308" y="175" width="40" height="3" rx="1.5" fill="#60A5FA" opacity="0.15"/>
  <!-- Notch -->
  <rect x="320" y="65" width="40" height="6" rx="3" fill="#1a1a1a"/>

  <!-- Desktop screen outline -->
  <rect x="440" y="85" width="220" height="155" rx="8" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.2"/>
  <rect x="450" y="100" width="200" height="120" rx="2" fill="#06B6D4" opacity="0.03"/>
  <!-- Desktop content -->
  <rect x="460" y="112" width="80" height="8" rx="4" fill="#06B6D4" opacity="0.12"/>
  <rect x="460" y="130" width="120" height="4" rx="2" fill="#06B6D4" opacity="0.06"/>
  <rect x="460" y="142" width="100" height="4" rx="2" fill="#06B6D4" opacity="0.06"/>
  <!-- Cards row -->
  <rect x="460" y="160" width="55" height="40" rx="4" fill="#083344" opacity="0.4" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.2"/>
  <rect x="525" y="160" width="55" height="40" rx="4" fill="#083344" opacity="0.4" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.2"/>
  <rect x="590" y="160" width="55" height="40" rx="4" fill="#083344" opacity="0.3" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.15"/>
  <!-- Stand -->
  <rect x="530" y="240" width="40" height="8" rx="2" fill="#06B6D4" opacity="0.08"/>

  <!-- Connection line mobile to desktop -->
  <g stroke="#4B5563" stroke-width="1" opacity="0.15" stroke-dasharray="4,4">
    <line x1="400" y1="165" x2="440" y2="165"/>
  </g>

  <!-- Divider -->
  <line x1="250" y1="340" x2="550" y2="340" stroke="#3B82F6" stroke-width="1" opacity="0.1"/>

  <!-- Title -->
  <text x="400" y="390" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="32" font-weight="bold">Banco Ripley</text>
  <text x="400" y="425" text-anchor="middle" fill="#9CA3AF" font-family="system-ui" font-size="14">Digital banking redesign — Mobile &amp; Web</text>

  <!-- Metrics -->
  <text x="200" y="500" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="24" font-weight="bold">+40%</text>
  <text x="200" y="525" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Self-service</text>

  <text x="400" y="500" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="24" font-weight="bold">2M+</text>
  <text x="400" y="525" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Users</text>

  <text x="600" y="500" text-anchor="middle" fill="#8B5CF6" font-family="monospace" font-size="24" font-weight="bold">-35%</text>
  <text x="600" y="525" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="11">Support calls</text>
</svg>
