  <line x1="510" y1="142" x2="460" y2="160" stroke="#4B5563" stroke-width="1" opacity="0.15"/>

  <circle cx="510" cy="250" r="24" fill="#1F2937" opacity="0.6" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3"/>
  <text x="510" y="255" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="9">Portal</text>
  <line x1="490" y1="238" x2="450" y2="215" stroke="#4B5563" stroke-width="1" opacity="0.15"/>

  <circle cx="290" cy="250" r="24" fill="#1F2937" opacity="0.6" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="290" y="255" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="9">Intra</text>
  <line x1="310" y1="238" x2="350" y2="215" stroke="#4B5563" stroke-width="1" opacity="0.15"/>

