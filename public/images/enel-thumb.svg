  <line x1="400" y1="94" x2="400" y2="115" stroke="#4B5563" stroke-width="1" opacity="0.15"/>

  <circle cx="530" cy="130" r="24" fill="#1F2937" opacity="0.6" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
