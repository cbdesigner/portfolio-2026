<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>

  <!-- Grid dots -->
  <g opacity="0.04" fill="#06B6D4">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="480" cy="80" r="1.5"/><circle cx="560" cy="80" r="1.5"/><circle cx="640" cy="80" r="1.5"/><circle cx="720" cy="80" r="1.5"/>
  </g>

  <!-- Diamond with 5 areas -->
  <g transform="translate(400, 175)">
    <!-- Diamond outline -->
    <path d="M0 -90 L90 0 L0 90 L-90 0 Z" fill="#083344" opacity="0.12" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Cross lines dividing diamond -->
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#06B6D4" stroke-width="0.5" opacity="0.12"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#06B6D4" stroke-width="0.5" opacity="0.12"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="20" fill="#083344" opacity="0.5" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.35"/>
    <text x="0" y="5" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="9" font-weight="bold">UX</text>

    <!-- Top: Strategy -->
    <circle cx="0" cy="-55" r="10" fill="#1F2937" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="-52" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="7">S</text>
    <text x="0" y="-72" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Strategy</text>

    <!-- Right: Enterprise -->
    <circle cx="55" cy="0" r="10" fill="#1F2937" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="55" y="3" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="7">E</text>
    <text x="110" y="4" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Enterprise</text>

    <!-- Bottom: Experience -->
    <circle cx="0" cy="55" r="10" fill="#1F2937" stroke="#EC4899" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="58" text-anchor="middle" fill="#F9A8D4" font-family="monospace" font-size="7">X</text>
    <text x="0" y="78" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Experience</text>

    <!-- Left: Team -->
    <circle cx="-55" cy="0" r="10" fill="#1F2937" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
    <text x="-55" y="3" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="7">T</text>
    <text x="-105" y="4" text-anchor="middle" fill="#6B7280" font-family="system-ui" font-size="9">Team</text>

    <!-- Bottom-right: Operations -->
    <circle cx="38" cy="38" r="10" fill="#1F2937" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="38" y="41" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="7">O</text>
    <text x="80" y="52" text-anchor="start" fill="#6B7280" font-family="system-ui" font-size="9">Operations</text>
  </g>

  <!-- Connecting lines -->
  <g transform="translate(400, 175)" stroke="#4B5563" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="-20" x2="0" y2="-45"/>
    <line x1="20" y1="0" x2="45" y2="0"/>
    <line x1="0" y1="20" x2="0" y2="45"/>
    <line x1="-20" y1="0" x2="-45" y2="0"/>
    <line x1="14" y1="14" x2="30" y2="30"/>
  </g>

  <!-- Divider -->
  <line x1="250" y1="320" x2="550" y2="320" stroke="#06B6D4" stroke-width="1" opacity="0.1"/>

  <!-- Title -->
  <text x="400" y="370" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="32" font-weight="bold">UX Strategy</text>
  <text x="400" y="405" text-anchor="middle" fill="#9CA3AF" font-family="system-ui" font-size="14">5 areas to lead design teams at scale</text>

  <!-- Area pills -->
  <rect x="120" y="445" width="100" height="28" rx="14" fill="#1F2937" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="170" y="464" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="10">Strategy</text>

  <rect x="235" y="445" width="100" height="28" rx="14" fill="#1F2937" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="285" y="464" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="10">Enterprise</text>

  <rect x="350" y="445" width="100" height="28" rx="14" fill="#1F2937" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="400" y="464" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10">Team</text>

  <rect x="465" y="445" width="110" height="28" rx="14" fill="#1F2937" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="520" y="464" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">Operations</text>

  <rect x="590" y="445" width="100" height="28" rx="14" fill="#1F2937" stroke="#EC4899" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="640" y="464" text-anchor="middle" fill="#F9A8D4" font-family="monospace" font-size="10">Experience</text>

  <!-- Role tag -->
  <text x="400" y="530" text-anchor="middle" fill="#4B5563" font-family="monospace" font-size="12">Strategic Framework</text>
</svg>
